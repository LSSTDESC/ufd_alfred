setup : #user input
  where : 'nersc' #usdf or nersc
  home_dir : #path where I want everything to save
    nersc : '$HOME/ufd_alfred'
    usdf : '$HOME/rubin-user/ufd_alfred'
  pckg_dir : 'alfred' #path to the package
  data_dir : 'euclid_data' #path to the external data needed (maps, euclid data, etc)
output:
  results_dir : 'results'
  plots_dir : 'plots'

nside : 32

#change with new data releases
opt_survey : 'des_y6' #or 'lsst_dp1' or 'des_y6'
ir_survey : 'euclid_q1' #or 'euclid dr1' or eventually 'roman'

lsst_dp1:
    repo_config :
        nersc : '/global/cfs/cdirs/lsst/production/gen3/rubin/DP1/repo/butler.yaml'
    collection :
        nersc : 'LSSTComCam/DP1'
    instrument : 'LSSTComCam'
    skymap : 'lsst_cells_v1'
    tract_list : [453, 454, 4849, 5063, 4848, 2394, 2234, 4016, 4017, 4218, 4217, 5525, 5526, 7611, 7610, 7850, 10463, 10464, 10704]
    tract2field_dict : {453: '47 Tuc',
                        454: '47 Tuc',
                        4849: 'ECDFS',
                        5063: 'ECDFS',
                        4848: 'ECDFS',
                        2394: 'EDFS',
                        2234: 'EDFS',
                        4016: 'Fornax',
                        4017: 'Fornax',
                        4218: 'Fornax',
                        4217: 'Fornax',
                        5525: 'Rubin_SV_095-25',
                        5526: 'Rubin_SV_095-25',
                        7611: 'Seagull',
                        7610: 'Seagull',
                        7850: 'Seagull',
                        10463: 'Rubin_SV_38_7',
                        10464: 'Rubin_SV_38_7',
                        10704: 'Rubin_SV_38_7'
                        }
    field2tract_dict : {'47 Tuc' : [453],
                        '47 Tuc' : [454],
                        'ECDFS' : [4849, 5063, 4848],
                        'EDFS' : [2394, 2234],
                        'Fornax' : [4016, 4017, 4218, 4217],
                        'Rubin_SV_095-25' : [5525, 5526],
                        'Seagull' : [7611, 7610, 7850],
                        'Rubin_SV_38_7' : [10463, 10464, 10704]
                        }
    bands : 'griz'
    # depending on which survey, our preferred star-galaxy separating columns will change
    INCOLS : ['coord_ra', 'coord_dec', 'detect_isIsolated', '{band}_psfFlux', '{band}_cModelFlux', 
              '{band}_cModelFluxErr', '{band}_psfFluxErr', 'refExtendedness', '{band}_extendedness',
              '{band}_psfFlux_flag', '{band}_sizeExtendedness', '{band}_sizeExtendedness_flag']
    s-g separator : '{band}_sizeExtendedness'

lsst_dp2:
    repo_config :
        nersc : 'dp2'
        usdf : 'dp2_prep'
    collection :
