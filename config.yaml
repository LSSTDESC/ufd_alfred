        usdf : ['LSSTCam/runs/DRP/DP2/v30_0_0/DM-53881/stage1',
                'LSSTCam/runs/DRP/DP2/v30_0_0/DM-53881/stage2',
                'LSSTCam/runs/DRP/DP2/v30_0_6_rc1/DM-53881/stage3',
                'LSSTCam/runs/DRP/DP2/v30_0_0/DM-53881/stage4']
    instrument : 'LSSTCam'
    skymap : 'lsst_cells_v2'
    #tract_list :
    field2tract_dict : {'47 Tuc' : [531, 532, 453, 454],
                        'ECDFS' : [4848, 4849, 5063, 4636, 4637, 4638, 4847, 4850, 5061, 5062, 5064, 5065, 5279, 5280, 5281,
                                 5282], #Euclid's "Euclid Deep Field Fornax" encompasses Extended Chandra Deep Field South
                        'EDFS' : [2078, 2079, 2080, 2232, 2233, 2234, 2235, 2236, 2237, 2392, 2393, 2394, 2395, 2396, 2397,
                                2557, 2558, 2559, 2560, 2561, 2562, 2728, 2729, 2730, 2731],
