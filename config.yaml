euclid_q1:
    bands : ['VIS', 'Y', 'J', 'H']
    INCOLS : ['RIGHT_ASCENSION', 'DECLINATION', 'POINT_LIKE_PROB', 'POINT_LIKE_FLAG', 
              'ELLIPTICITY', 'MUMAX_MINUS_MAG', 'SPURIOUS_FLAG', 'DET_QUALITY_FLAG', 'FWHM', 'SEGMENTATION_MAP_ID',
              'FLUX_VIS_PSF', 'FLUXERR_VIS_PSF', 'FLAG_{band}', 'FLUX_{band}_2FWHM_APER', 'FLUXERR_{band}_2FWHM_APER']

des_y6:
    bands : 'grizy'
    INCOLS : ['coadd_object_id', 'alphawin_j2000', 'deltawin_j2000', 'psf_mag_aper_8_{band}_corrected', 'psf_mag_err_aper_8_{band}', 
              'flags_foreground', 'flags_footprint', 'flags_gold', 'ext_mash']

